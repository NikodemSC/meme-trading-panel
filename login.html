<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MemePilot · Konto</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="brand" href="./login.html"><span class="brand-mark">M</span><span>MemePilot</span></a>
    <section class="auth-card">
      <span class="eyebrow">WYBIERZ SWOJE KONTO</span>
      <h1 id="authTitle">Kto korzysta?</h1>
      <div id="accountChoices" class="account-choices" aria-label="Wybór konta"></div>
      <form id="authForm" class="hidden">
        <div class="selected-account"><button id="backToAccounts" type="button" aria-label="Wróć">←</button><strong id="selectedAccountName"></strong></div>
        <label>Hasło<input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label>
        <label id="repeatPasswordField" class="hidden">Powtórz hasło<input id="repeatPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256"></label>
        <label id="setupCodeField" class="hidden">Kod konfiguracji serwera<input id="setupCode" autocomplete="off" placeholder="Lokalnie zostaw puste"></label>
        <button id="authSubmit" class="button accent wide" type="submit">Zaloguj</button>
        <p id="authError" class="message error" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="./frontend-config.js?v=20261031-3"></script>
  <script src="./connection.js?v=20261031-3"></script>
  <script src="./login.js?v=20261031-3"></script>
</body>
</html>
